name: check

# 用引号包裹 on 键，避免 YAML 1.1 把 on 解析为布尔值（on=true）导致的解析错误
"on":
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
      - "maatools.config.mts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tools/**"
      - "deps/tools/**"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
      - "maatools.config.mts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tools/**"
      - "deps/tools/**"
  workflow_dispatch:

jobs:
  resource:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run maa-checker
        run: |
          npm ci
          npx --yes @nekosu/maa-tools check maatools.config.mts

      - name: Validate JSON Schema
        run: |
          python -m pip install jsonschema==4.26.0 referencing==0.37.0
          python tools/validate_schema.py --schema-dir deps/tools --resource-dirs assets/resource --exclude-dirs assets/resource/announcement --interface-files assets/interface.json
