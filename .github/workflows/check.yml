name: check

on:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/check.yml"
      - "assets/**"
      - "**.py"
  workflow_dispatch:

jobs:
  resource:
    runs-on: ubuntu-latest
    env:
      ACTIONS_STEP_DEBUG: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run maa-checker (verbose + capture)
        run: |
          set -o pipefail
          echo "=== debug: node/npm versions ==="
          node -v || true
          npm -v || true

          echo "=== npm ci ==="
          npm ci --no-audit --prefer-offline

          echo "=== running maa-tools (verbose) ==="
          # 加上 --yes 以避免 npx 交互提示；如果工具支持 --debug/--verbose，请使用
          npx --yes @nekosu/maa-tools check --debug 2>&1 | tee maa-checker.log
          tool_exit=${PIPESTATUS[0]}

          if [ "$tool_exit" -ne 0 ]; then
            echo "::error::maa-tools failed with exit code $tool_exit"
            echo "=== last 200 lines of maa-checker.log ==="
            tail -n 200 maa-checker.log || true
            exit $tool_exit
          fi

      - name: Install maafw
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade maafw --pre

      - name: Validate JSON Schema
        run: |
          python -m pip install jsonschema==4.26.0 referencing==0.37.0
          python tools/validate_schema.py --schema-dir deps/tools --resource-dirs assets/resource --exclude-dirs assets/resource/announcement --interface-files assets/interface.json